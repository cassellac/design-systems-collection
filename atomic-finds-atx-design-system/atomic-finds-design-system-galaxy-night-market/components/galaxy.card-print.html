<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 25% 25%, rgba(245,200,66,0.10) 0%, transparent 45%),
      radial-gradient(ellipse at 78% 72%, rgba(212,130,42,0.10) 0%, transparent 45%),
      linear-gradient(160deg, #211C14 0%, #16140F 60%, #1A160F 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #root { display: flex; align-items: center; justify-content: center; gap: 220px; }

  @media print {
    @page { size: letter landscape; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    html, body {
      height: auto;
      overflow: visible;
      padding: 0.4in;
      box-sizing: border-box;
    }
    #root {
      width: 100%;
      height: auto;
      flex-wrap: wrap;
      gap: 40px;
    }

    *, *::before, *::after {
      animation-delay: -99s !important;
      animation-duration: .001s !important;
      animation-iteration-count: 1 !important;
      animation-fill-mode: both !important;
      animation-play-state: running !important;
      transition-duration: 0s !important;
    }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#16140F"/>
      <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="#F5C842" stroke-width="2" transform="rotate(-20 50 50)"/>
      <circle cx="50" cy="50" r="10" fill="#D4822A"/>
      <circle cx="79" cy="42" r="3.5" fill="#A3E4D7"/>
    </svg>
  </template>
  <div id="root"></div>
  <script>
    var NS = window.AtomicFindsDesignSystem_29110a || window;
    var GalaxyCard = NS.GalaxyCard;
    var h = React.createElement;
    ReactDOM.createRoot(document.getElementById('root')).render(
      h(React.Fragment, null,
        h(GalaxyCard, {
          title: 'Peacock',
          script: 'vintage find',
          desc: '1970s rattan peacock chair, restored cane back. A dramatic seating option for sunrooms.',
          price: 1450,
          image: '../assets/products/product-peacock-chair-02.png',
          bg: '../assets/patterns/nebula-ochre.webp',
          dimensions: 'H 58" x W 40" x D 32"',
          origin: 'Philippines',
          era: '1970s'
        }),
        h(GalaxyCard, {
          title: 'Rattan Lounge Chair',
          script: 'vintage find',
          desc: 'Newly restored upholstery in neutral linen. A statement piece that catches light beautifully. Fully functional and ready for your living room.',
          price: 145,
          image: '../assets/products/product-rattan-chair-04.png',
          bg: '../assets/patterns/nebula-violet.webp',
          dimensions: 'H 34" x W 28" x D 30"',
          origin: 'United States',
          era: '1970s'
        })
      )
    );
  </script>
  <script>
    addEventListener('load', () => {
      (async () => {
        try { await document.fonts.ready; } catch (e) {}
        let tries = 0;
        while (document.getElementById('root').children.length === 0 && tries < 100) {
          await new Promise((r) => setTimeout(r, 50));
          tries++;
        }
        const imgs = Array.from(document.images).filter((i) => !i.complete);
        await Promise.race([
          Promise.allSettled(imgs.map((i) => i.decode())),
          new Promise((r) => setTimeout(r, 8000)),
        ]);
        setTimeout(() => window.print(), 500);
      })();
    });
  </script>
</body>
</html>
