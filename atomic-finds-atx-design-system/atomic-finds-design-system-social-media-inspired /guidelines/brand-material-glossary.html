<style>body{margin:0;height:230px;background:var(--bg-page);padding:18px;box-sizing:border-box;font-family:var(--font-body);display:flex;gap:14px}.card{flex:1;background:var(--bg-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px}.t{font-family:var(--font-heading);font-weight:600;color:var(--brand-primary);font-size:16px;margin-bottom:6px}.d{font-size:12px;color:var(--text-secondary);line-height:1.4}</style>
<div class="card"><div class="t">Rattan</div><div class="d">Solid-core climbing palm vine. Heavy, dense, bends into curved frames.</div></div>
<div class="card"><div class="t">Bamboo</div><div class="d">Hollow-core grass. Rigid, straight, smooth segmented nodes.</div></div>
<div class="card"><div class="t">Wicker</div><div class="d">Not a material — a weaving technique using cane, reed or rattan peel over a frame.</div></div>
