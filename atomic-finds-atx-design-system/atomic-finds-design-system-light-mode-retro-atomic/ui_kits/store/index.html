<!-- @startingPoint section="Store" subtitle="Atomic Finds storefront home" viewport="1280x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Finds — Store</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}
a{color:var(--link)}a:hover{color:var(--link-hover)}</style>
</head>
<body>
<div id="root"></div>
<script src="./data.js"></script>
<script type="text/babel" src="./Header.jsx"></script>
<script type="text/babel" src="./HomeScreen.jsx"></script>
<script type="text/babel" src="./ProductScreen.jsx"></script>
<script type="text/babel" src="./CrateScreen.jsx"></script>
<script type="text/babel">
function App(){
  const data = window.STORE_DATA;
  const [route, setRoute] = React.useState({name:'home'});
  const [query, setQuery] = React.useState('');
  const [crateOpen, setCrateOpen] = React.useState(false);
  const [crate, setCrate] = React.useState([]);

  const add = (rec)=> setCrate(c=>{
    const found = c.find(i=>i.id===rec.id);
    if(found) return c.map(i=>i.id===rec.id?{...i,qty:i.qty+1}:i);
    return [...c,{...rec,qty:1}];
  });
  const remove = (id)=> setCrate(c=>c.filter(i=>i.id!==id));
  const count = crate.reduce((s,i)=>s+i.qty,0);

  return (
    <React.Fragment>
      <Header crateCount={count} query={query} onQuery={setQuery}
        onNav={(n)=>{setRoute({name:n}); setCrateOpen(false);}}
        onOpenCrate={()=>setCrateOpen(true)} />
      {route.name==='home' &&
        <HomeScreen data={data} query={query}
          onOpen={(rec)=>{setRoute({name:'product',rec}); window.scrollTo(0,0);}}
          onAdd={(rec)=>{add(rec); setCrateOpen(true);}} />}
      {route.name==='product' &&
        <ProductScreen item={route.rec}
          onBack={()=>setRoute({name:'home'})}
          onAdd={(rec)=>{add(rec); setCrateOpen(true);}} />}
      {crateOpen &&
        <CrateScreen items={crate} onClose={()=>setCrateOpen(false)}
          onRemove={remove} onCheckout={()=>{}} />}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
