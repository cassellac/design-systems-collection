<!-- @dsCard group="Components" viewport="700x400" name="Cards" subtitle="Feature cards with hover lift & glow" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 32px; background: #1E1E1E; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
  .card-icon { width: 32px; height: 32px; object-fit: contain; margin-bottom: 12px; display: block; }
  .card-title { font-family: var(--font-display); font-size: 18px; color: #F5C842; text-shadow: var(--glow-sm); margin: 0 0 8px 0; }
  .card-text { font-family: var(--font-body); font-size: 13px; color: #9A8F7D; margin: 0; line-height: 1.6; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    var NS = window.AtomicFindsDesignSystem_29110a;
    var Card = NS.Card;
    var h = React.createElement;
    var items = [
      { icon: '../assets/icons/bamboo-chair.png', title: 'Seating', text: '1970s iconic pieces, lovingly restored.' },
      { icon: '../assets/icons/woven-basket.png', title: 'Storage', text: 'Bamboo & rattan shelving & cabinets.' },
      { icon: '../assets/icons/bamboo-lamp.png', title: 'Lighting', text: 'Woven dome lamps & brass fixtures.' },
      { icon: '../assets/icons/sun.png', title: 'Mirrors', text: 'Sunburst & geometric rattan frames.' }
    ];
    ReactDOM.createRoot(document.getElementById('root')).render(
      h('div', { className: 'card-grid' }, items.map(function (it, i) {
        return h(Card, { key: i },
          h('img', { className: 'card-icon', src: it.icon, alt: '' }),
          h('h3', { className: 'card-title' }, it.title),
          h('p', { className: 'card-text' }, it.text)
        );
      }))
    );
  </script>
</body>
</html>
