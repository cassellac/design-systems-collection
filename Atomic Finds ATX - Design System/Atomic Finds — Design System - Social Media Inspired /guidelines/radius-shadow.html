<!-- @dsCard group="Spacing" viewport="700x160" name="Radius & shadow" subtitle="Soft rounded, sticker vs card shadow" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:160px;background:var(--bg-page);display:flex;align-items:center;gap:24px;padding:20px;box-sizing:border-box;font-family:var(--font-body);font-size:11px;color:var(--text-secondary)}.box{width:90px;height:90px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;text-align:center}</style>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-card)">radius-sm<br>card shadow</div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-card)">radius-lg<br>card shadow</div>
<div class="box" style="border-radius:var(--radius-pill);box-shadow:var(--shadow-sticker);border:3px solid var(--espresso)">pill<br>sticker</div>
<div class="box" style="border-radius:50%;background:var(--status-available-bg);color:#fff;box-shadow:var(--shadow-sticker)">circle<br>badge</div>
