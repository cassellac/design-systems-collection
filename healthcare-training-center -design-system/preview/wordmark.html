<!-- @dsCard group="Brand" name="Brand — Lockup Reversal" subtitle="On cream + on navy" viewport="700x150" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; box-sizing:border-box; display:flex; }
  .half { flex:1; padding:24px 28px; display:flex; flex-direction:column; justify-content:center; gap:8px; }
  .light { background:var(--color-cream); }
  .dark { background:var(--color-navy); }
  .eyebrow { font-family:var(--font-heading); font-weight:700; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--color-teal); }
  .lock { display:flex; align-items:center; gap:13px; }
  .lock img { height:46px; display:block; }
  .word { font-family:var(--font-heading); font-weight:800; font-size:22px; letter-spacing:.02em; line-height:1; }
</style></head>
<body>
  <div class="half light">
    <span class="eyebrow">Selfless care · since the myth</span>
    <div class="lock">
      <img src="../assets/brand/logos/logo-icon-compound.png" alt="Caladrius bird">
      <span class="word" style="color:var(--color-navy);">CALADRIUS</span>
    </div>
  </div>
  <div class="half dark">
    <span class="eyebrow">Selfless care · since the myth</span>
    <div class="lock">
      <img src="../assets/brand/logos/logo-icon-sun.png" alt="Caladrius bird">
      <span class="word" style="color:#fff;">CALADRIUS</span>
    </div>
  </div>
</body></html>
