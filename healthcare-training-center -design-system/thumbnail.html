<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:854px;display:flex;font-family:var(--font-body)}
.main{flex:1;background:var(--color-navy);display:flex;align-items:center;justify-content:center}
.main img{width:340px;height:340px;object-fit:contain}
.strip{width:120px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body>
<div class="main"><img src="assets/brand/logos/logo-icon-sun.png" alt="Caladrius"></div>
<div class="strip">
<div style="background:var(--color-teal)"></div>
<div style="background:var(--color-amber)"></div>
<div style="background:var(--color-room-records)"></div>
<div style="background:var(--color-navy-700)"></div>
</div>
</body></html>
